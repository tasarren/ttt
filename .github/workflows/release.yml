name: release
on:
  release: { types: [published] } # owner presses Publish on a GitHub Release; bare tag pushes ship nothing
permissions:
  contents: read
  id-token: write # OIDC trusted publishing, no NPM_TOKEN
jobs:
  publish:
    if: github.event.release.prerelease == false # prereleases never reach npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: pnpm/action-setup@v4
        with: { version: 11.24.0 }
      - uses: actions/setup-node@v4
        with: { node-version: "24.11.0", cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: pnpm install --frozen-lockfile
      - run: node .orchestrator/scripts/verify-release.mjs "$RELEASE_TAG"
        env: { RELEASE_TAG: "${{ github.event.release.tag_name }}" }
      - run: pnpm run check
      - run: pnpm run verify:packed
      - run: pnpm --filter @tasarren/ttt stage publish --access public --no-git-checks
        # Staged publishing: CI uploads, a maintainer approves on npmjs.com (or `pnpm stage approve`).
        # The trusted publisher entry is stage-only on purpose. --no-git-checks: release checkouts are
        # detached-HEAD by design; the tag==version guard above is the real safety check.
