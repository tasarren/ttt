name: ci
on:
  push: { branches: [main] }
  pull_request: {}
  workflow_call: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: check (tmux ${{ matrix.tmux }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        tmux: ["3.2", "3.4", "3.8"]
    steps:
      - uses: actions/checkout@v4
      - run: sh .orchestrator/scripts/verify-container.sh "$TMUX_VERSION"
        env: { TMUX_VERSION: "${{ matrix.tmux }}" }
