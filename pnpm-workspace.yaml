packages:
  - "packages/*"

catalogs:
  runtime:
    jsonc-parser: 3.3.1
  ui:
    vue: 3.5.43
    ajv: 8.20.0
    ajv-formats: 3.0.1
    histoire: 1.0.0-beta.1
    "@histoire/plugin-vue": 1.0.0-beta.1
    vite: 7.3.6
    "@vitejs/plugin-vue": 6.0.9
    "@xterm/xterm": 6.0.0
  web:
    hono: 4.13.9
    "@hono/node-server": 2.1.1
    "@vue/server-renderer": 3.5.43
    pinia: 4.0.3
    vue-router: 5.3.1
    vite: 8.3.1
  devTools:
    "@eslint/js": 10.0.1
    "@stylistic/eslint-plugin": 5.10.0
    "@types/node": 26.3.0
    eslint: 10.9.1
    eslint-import-resolver-typescript: 4.4.5
    eslint-plugin-import-x: 4.17.1
    eslint-plugin-unused-imports: 4.4.1
    globals: 17.11.0
    tsdown: 0.22.14
    typescript: 6.0.3
    typescript-eslint: 8.68.0

allowBuilds:
  esbuild: true
  unrs-resolver: true

overrides:
  '@tasarren/ttt': link:packages/cli
  # Keep all Vue peer-graph resolutions patched; remove once its compilers require >=1.2.2.
  source-map-js@1.2.1: 1.2.2
